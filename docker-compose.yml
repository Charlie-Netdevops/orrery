# Orrery - docker compose up -d --build   then open http://127.0.0.1:3000
# Settings come from .env (copy .env.example to .env first).
services:
  orrery:
    build: .
    image: ${ORRERY_CONTAINER_NAME:-orrery}:local
    container_name: ${ORRERY_CONTAINER_NAME:-orrery}
    ports:
      # Default: only reachable from this computer. LAN mode = ORRERY_BIND=0.0.0.0 (+ APP_PASSWORD).
      - "${ORRERY_BIND:-127.0.0.1}:${ORRERY_PORT:-3000}:8000"
    env_file: .env
    environment:
      ORRERY_BIND: ${ORRERY_BIND:-127.0.0.1}     # tells the app whether LAN mode is on
    volumes:
      - ./config:/app/config:ro                  # edit config/models.json without rebuilding
    extra_hosts:
      - "host.docker.internal:host-gateway"      # lets the container reach Ollama on your computer
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
