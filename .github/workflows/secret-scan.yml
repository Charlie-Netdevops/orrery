name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, so old commits are scanned too
      - name: gitleaks - full git history
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --redact --no-banner -v
      - name: gitleaks - working tree
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.21.2 dir /repo --redact --no-banner -v
