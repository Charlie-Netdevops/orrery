<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
  <title id="t">Orrery</title>
  <!-- Orbit rings: mid-grey so they read on dark and light backgrounds -->
  <g fill="none" stroke="#8790b3" stroke-width="1.4">
    <circle cx="32" cy="32" r="12.5" stroke-opacity=".85"/>
    <circle cx="32" cy="32" r="20.5" stroke-opacity=".7"/>
    <circle cx="32" cy="32" r="28.5" stroke-opacity=".55"/>
  </g>
  <!-- Sun -->
  <circle cx="32" cy="32" r="8.6" fill="none" stroke="#f5b544" stroke-opacity=".35" stroke-width="1.6"/>
  <circle cx="32" cy="32" r="5.8" fill="#f5b544"/>
  <!-- Planets -->
  <circle cx="40.84" cy="23.16" r="2.6" fill="#6f7dff"/>
  <circle cx="12.74" cy="39.01" r="3.3" fill="#2fb5a3"/>
  <circle cx="58.78" cy="22.25" r="2.2" fill="#e8765a"/>
</svg>
